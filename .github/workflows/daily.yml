name: Daily digest

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = 北京时间 05:00（GitHub 定时任务有排队延迟，提前量给足）
  workflow_dispatch:          # 支持手动触发

# 同一时间只允许一个实例，避免重复抓取
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write      # 提交 data/ 变更
  pages: write         # 部署 Pages
  id-token: write      # Pages 部署鉴权

env:
  PYTHONUNBUFFERED: "1"

jobs:
  digest-and-deploy:
    runs-on: ubuntu-latest
    environment: aisite    # 读取 aisite environment 中的 DEEPSEEK_API_KEY
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        run: python pipeline/main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore(data): daily digest $(date -u +%Y-%m-%d) [skip ci]" && git push)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p publish
          cp -r site/* publish/
          cp -r data publish/data
          touch publish/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
